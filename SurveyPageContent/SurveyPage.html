<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="SharedContent/StyleVariables.css">
  <link rel="stylesheet" href="formStyle.Css">
</head>
<body>

  <div id="bgoverlay">

  </div>

  <form>

    <div class="FormTop">
      <h1>PFL Travel Agency LLC</h1>
      <p style="font-weight:thin ;">Share your trip details with us </p>
      <hr>
    </div>

    <div class="FormQuestion">

      <lable for="Prefix">Prefix</lable>
      <input type="text" id="Prefix" name="prefix" class="styleTextBox">
    </div>

    <div class="FormQuestion">
      <lable for="FirstName">First name</lable>
      <input type="text" id="FirstName" name="FirstName" class="styleTextBox">
    </div>

    <div class="FormQuestion">
      <lable for="MiddleName">Middle name</lable>
      <input type="text" id="MiddleName" name="MiddleName" class="styleTextBox">
    </div>

    <div class="FormQuestion">
      <lable for="LastName">Last name</lable>
      <input type="text" id="LastName" name="LastName" class="styleTextBox">
    </div>

    <div class="FormQuestion">
      <lable for="Email">Email</lable>
      <input placeholder="Ex: Example@Gmail.com" type="email" id="Email" name="Email" class="styleTextBox">
    </div>

    <div class="FormQuestion">
      <lable for="PhoneNumber">Phone number</lable>
      <input placeholder=" Enter Phone Number" type="number" id="PhoneNumber" name="PhoneNumber" class="styleTextBox">
    </div>

    <div class="FormQuestion">
      <lable for="Adults">How many adults</lable>
      <input placeholder="Ex: 2" type="number" id="Adults" name="Adults" class="styleTextBox">
    </div>

    <div class="FormQuestion">
      <lable for="Kids">How many kids</lable>
      <input placeholder="Ex: 7" type="number" id="Kids" name="Kids" class="styleTextBox">
    </div>
    
    <div class="FormQuestion">
      <lable for="KidsAge">Age of kids</lable>
      <input placeholder="Ex: 5, 10" type="text" id="KidsAge" name="KidsAge" class="styleTextBox">
    </div>
    
    <div class="FormQuestion">
      <lable for="Specialoccasion">Special occasion?</lable>
      <input placeholder="Ex: HoneyMoon/Anniversery/Birthday/Family Trip" type="text" id="Specialoccasion" name="Specialoccasion" class="styleTextBox">
    </div> 

    <div class="FormQuestion">
      <lable for="Idealtrip">Describe your ideal trip</lable>
      <textarea id="Idealtrip" name="Idealtrip" placeholder="Travel style/intrest/must-dos"></textarea>
    </div> 

    <lable for="submit"></lable>
    <input type="submit" id="submit" name="submit">


  </form>
  
</body>
</html>
